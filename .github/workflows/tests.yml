# Bottles: on a pull request that changes the formula, brew test-bot builds code2pdf on each
# platform, packs the bottle, reinstalls code2pdf from it and runs the formula's test. Then
# `pour` installs each bottle on a fresh runner, as a user's `brew install` would, and prints
# with it (.github/check.py). Nothing is published here: publish.yml does that, run by hand.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon on each macOS GitHub has (a bottle also serves later macOS versions),
        # Intel, and Linux in Homebrew's own container
        os: [ macos-14, macos-15, macos-26, macos-15-intel ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Bottles go into this tap's GitHub release code2pdf-<version>, which publish.yml creates
      - name: Where the bottles will be published
        id: root-url
        if: github.event_name == 'pull_request'
        run: |
          version=$(brew ruby -e 'puts Formula["readbysearch/tap/code2pdf"].pkg_version')
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/code2pdf-${version}" >> "$GITHUB_OUTPUT"

      - run: brew test-bot --only-formulae --root-url="${ROOT_URL}"
        if: github.event_name == 'pull_request'
        env:
          ROOT_URL: ${{ steps.root-url.outputs.url }}

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  # Only a pull request that changes the formula has bottles to pour
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      formula: ${{ steps.files.outputs.formula }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename' | grep -qx code2pdf.rb
          then echo "formula=true" >> "$GITHUB_OUTPUT"
          else echo "formula=false" >> "$GITHUB_OUTPUT"
          fi

  pour:
    needs: [ test-bot, changes ]
    if: github.event_name == 'pull_request' && needs.changes.outputs.formula == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, macos-15, macos-26, macos-15-intel ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download this platform's bottle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: ${{ runner.temp }}/bottles

      # Linux desktops have CJK fonts; Homebrew's container doesn't
      - name: Chinese, Japanese and Korean fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install code2pdf from the bottle
        env:
          BOTTLES: ${{ runner.temp }}/bottles
        run: |
          time brew install --formula "$BOTTLES"/code2pdf--*.bottle*.tar.gz
          brew info readbysearch/tap/code2pdf | tee "$RUNNER_TEMP/info.txt"
          grep -q 'Poured from bottle' "$RUNNER_TEMP/info.txt"

      - name: Print with it
        run: |
          keg=$(brew --prefix readbysearch/tap/code2pdf)
          "$keg/libexec/bin/python" -I "$(brew --repository readbysearch/tap)/.github/check.py" \
            "$(brew --prefix)/bin/code2pdf" "$RUNNER_TEMP/check"
